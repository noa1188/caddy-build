name: Check Caddy Update

on:
  schedule:
    - cron: "5 1 */5 * *"
  workflow_dispatch:

concurrency:
  group: check-caddy-update
  cancel-in-progress: false

jobs:
  check-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      DOCKERFILE_PATH: ./Dockerfile
      BRANCH_PREFIX: chore/bump-caddy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq gh

      - name: Check latest stable Caddy version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(grep -oP '(?<=^ARG CADDY_VERSION=).*' "$DOCKERFILE_PATH")"
          echo "Current version: $CURRENT_VERSION"

          LATEST_VERSION="$(
            curl -fsSL 'https://registry.hub.docker.com/v2/repositories/library/caddy/tags?page_size=100' \
              | jq -r '.results[].name' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$LATEST_VERSION" ]; then
            echo "Failed to resolve latest stable Caddy version."
            exit 1
          fi

          echo "Latest stable version: $LATEST_VERSION"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "No update needed."
            exit 0
          fi

          sed -i "s/^ARG CADDY_VERSION=$CURRENT_VERSION$/ARG CADDY_VERSION=$LATEST_VERSION/" "$DOCKERFILE_PATH"

          BRANCH_NAME="${BRANCH_PREFIX}-${LATEST_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add "$DOCKERFILE_PATH"
          git commit -m "chore: bump Caddy to $LATEST_VERSION"
          git push --set-upstream origin "$BRANCH_NAME"

          if gh pr list --head "$BRANCH_NAME" --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore: bump Caddy to $LATEST_VERSION" \
              --body "Automated update of \`ARG CADDY_VERSION\` in \`Dockerfile\`.

- Previous version: \`$CURRENT_VERSION\`
- New version: \`$LATEST_VERSION\`

Review plugin compatibility, merge this PR, then create tag:
\`v$LATEST_VERSION\`"
          else
            echo "PR already exists for $BRANCH_NAME"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
