name: Check Caddy Update

on:
  schedule:
    - cron: "5 1 */5 * *"
  workflow_dispatch:

concurrency:
  group: check-caddy-update
  cancel-in-progress: false

jobs:
  check-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      DOCKERFILE_PATH: ./Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check latest stable Caddy version
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(grep -oP '(?<=^ARG CADDY_VERSION=).*' "$DOCKERFILE_PATH")"
          echo "Current version: $CURRENT_VERSION"

          LATEST_VERSION="$(
            curl -fsSL 'https://registry.hub.docker.com/v2/repositories/library/caddy/tags?page_size=100' \
              | jq -r '.results[].name' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$LATEST_VERSION" ]; then
            echo "Failed to resolve latest stable Caddy version."
            exit 1
          fi

          echo "Latest stable version: $LATEST_VERSION"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/^ARG CADDY_VERSION=$CURRENT_VERSION$/ARG CADDY_VERSION=$LATEST_VERSION/" "$DOCKERFILE_PATH"

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.version_check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump Caddy to ${{ steps.version_check.outputs.latest_version }}"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          signoff: false
          branch: "chore/bump-caddy-${{ steps.version_check.outputs.latest_version }}"
          delete-branch: true
          title: "chore: bump Caddy to ${{ steps.version_check.outputs.latest_version }}"
          body: |
            Automated update of `ARG CADDY_VERSION` in `Dockerfile`.

            - Previous version: `${{ steps.version_check.outputs.current_version }}`
            - New version: `${{ steps.version_check.outputs.latest_version }}`

            Suggested next steps:
            1. Review the PR diff.
            2. Merge the PR if plugin compatibility looks good.
            3. Create and push tag `v${{ steps.version_check.outputs.latest_version }}` to trigger release workflow.
